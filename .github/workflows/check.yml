# The same gate agents run locally (scripts/check.sh), with a local Supabase stack in Docker.
name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    # A repository variable HARNESS_RUNS_ON picks the runner, as JSON: '["self-hosted","macOS"]' for a
    # runner on your own machine (free, also for private repos). Unset: GitHub's ubuntu-latest.
    runs-on: ${{ fromJSON(vars.HARNESS_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: ${{ fromJSON(vars.HARNESS_CI_TIMEOUT || '30') }}  # a hung step fails, never blocks the loop
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # On a self-hosted runner the machine is shared: serve the app on a free port, never a fixed one.
      - name: Pick a free port
        run: echo "PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')" >> "$GITHUB_ENV"
      # Same guard as the pre-commit hook, over the whole PR. A human-led backlog
      # change (/kickoff, /replan, /bug) fails here by design; merge it with an admin override.
      - name: Integrity guard
        # A revert PR (agent/revert-*) restores main to an earlier verified state, so it may delete tests.
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'agent/revert-')
        # Compare with where the PR branched off, not the tip of main: once another PR
        # merges, main has files this branch never saw (a "deleted" test that is not).
        # A rule PR (agent/rule-*, opened by the loop from a repeated failure) may touch only the rule files.
        # The guard comes from the branch the PR merges into, never from the PR: a PR that rewrote
        # harness/integrity.py would otherwise judge itself. Agent branches may not touch protected files.
        run: |
          # A stacked PR's base branch is deleted once it merges; its queued runs compare with main.
          into="origin/${{ github.base_ref }}"; git rev-parse -q --verify "$into" >/dev/null || into=origin/main
          base="$(git merge-base "$into" HEAD)"
          git show "$into:harness/integrity.py" > "$RUNNER_TEMP/integrity.py" 2>/dev/null \
            || cp harness/integrity.py "$RUNNER_TEMP/integrity.py"
          python3 "$RUNNER_TEMP/integrity.py" --base "$base" --head HEAD \
            ${{ startsWith(github.head_ref, 'agent/rule-') && '--rule' || '' }} ${{ startsWith(github.head_ref, 'agent/') && '--agent' || '' }}
      - name: Secret scan
        run: |
          os="$(uname -s | tr A-Z a-z)"; arch="$(uname -m)"; [ "$arch" = x86_64 ] && arch=x64; [ "$arch" = aarch64 ] && arch=arm64
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_${os}_${arch}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          # The npm cache already lives on a self-hosted runner; uploading it to GitHub hung a job for 30 minutes
          # on a flaky network. GitHub's runners start empty, so they keep it.
          cache: ${{ !vars.HARNESS_RUNS_ON && 'npm' || '' }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0   # Semgrep (scripts/sast.sh)
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: ./scripts/check.sh
      - name: Wait for a quiet machine
        # A self-hosted runner shares the machine with the build loop's sessions: wait (up to 5 minutes) for it
        # to calm down before timing anything. A failed budget then means the code, not the neighbours.
        if: vars.HARNESS_RUNS_ON
        run: python3 harness/quiet.py
      - name: Performance budget
        run: ./scripts/perf.sh
      # Servers this job started (next dev for e2e, next start for Lighthouse) must not outlive it: on a
      # self-hosted runner one held port 3300 for 14 hours and failed every later run.
      - name: Stop servers this job started
        if: always()
        run: |
          cd /  # this step's own shell must not be in the workspace it clears
          lsof -a -d cwd -Fpn 2>/dev/null | awk -v w="$GITHUB_WORKSPACE/" '/^p/ {p = substr($0, 2)} /^n/ {if (index(substr($0, 2) "/", w) == 1) print p}' \
            | while read -r pid; do kill "$pid" 2>/dev/null; done || true  # the step runs under pipefail
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            .lighthouseci/
          retention-days: 7
